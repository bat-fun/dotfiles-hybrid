$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1800
}

# Background
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.92
    brightness = 0.55
    vibrancy = 0.35
}

# Clock - 12 hour
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"

    color = rgb(e5e2e0)
    font_family = $font Bold
    font_size = 76
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)

    position = 0, 108
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"

    color = rgb(c7c7bc)
    font_family = $font
    font_size = 16
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)

    position = 0, 36
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =

    size = 290, 46
    rounding = 16
    outline_thickness = 2

    outer_color = rgb(464741)
    inner_color = rgba(14, 14, 13, 0.85)
    font_color = rgb(e5e2e0)

    dots_size = 0.24
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##919189"><i>Enter Password...</i></span>
    hide_input = false

    check_color = rgb(c7c7bc)
    fail_color = rgb(ffb4ab)
    fail_text = <b>$FAIL</b>
    capslock_color = rgb(c8c6c1)

    position = 0, -96
    halign = center
    valign = center
}
