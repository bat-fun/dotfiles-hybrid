"$schema" = 'https://starship.rs/config-schema.json'
palette = 'matugen'

add_newline = false
scan_timeout = 30
command_timeout = 800

format = """$directory$git_branch$git_status$cmd_duration$character"""

[directory]
style = "bold #e5e2e0"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = "󰘬 "
format = "[$symbol$branch]($style) "
style = "bold #c7c7bc"
truncation_length = 24
truncation_symbol = "…"
only_attached = true

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold #919189"
conflicted = "󰀨"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
format = "$symbol "
success_symbol = "[❯](bold #c7c7bc)"
error_symbol = "[❯](bold #ffb4ab)"
vimcmd_symbol = "[❮](bold #919189)"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "dimmed #919189"

[palettes.matugen]
primary = "#c7c7bc"
secondary = "#c8c6c1"
tertiary = "#d0c3c9"
error = "#ffb4ab"
