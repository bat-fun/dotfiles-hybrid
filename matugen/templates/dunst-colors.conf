[global]
    monitor = 0
    follow = mouse
    origin = top-right
    offset = (8, 48)
    width = (300, 380)
    height = (0, 320)
    notification_limit = 4
    gap_size = 8

    # Progress bar (volume/brightness visual feedback)
    progress_bar = true
    progress_bar_height = 8
    progress_bar_frame_width = 0
    progress_bar_min_width = 200
    progress_bar_max_width = 340
    progress_bar_corner_radius = 4
    progress_bar_corners = all

    indicate_hidden = yes
    transparency = 0
    separator_height = 2
    padding = 14
    horizontal_padding = 16
    text_icon_padding = 14
    frame_width = 1
    separator_color = frame
    corner_radius = 12
    sort = urgency_descending
    idle_threshold = 120

    # Typography & Hierarchy
    font = JetBrainsMono Nerd Font 10.5
    line_height = 3
    markup = full
    format = "<b>%s</b>\n<span alpha='85%'>%b</span>"
    alignment = left
    vertical_alignment = center
    show_age_threshold = 60
    ellipsize = end
    word_wrap = yes
    stack_duplicates = true
    hide_duplicate_count = false
    show_indicators = yes

    # Icons
    icon_position = left
    min_icon_size = 36
    max_icon_size = 48
    icon_corner_radius = 8
    icon_theme = breeze-dark, Adwaita
    enable_recursive_icon_lookup = true

    # Context menu & browser integration
    dmenu = /usr/bin/rofi -dmenu -p "󰂚 " -theme ~/.config/rofi/config.rasi
    browser = /usr/bin/xdg-open

    # Mouse actions
    mouse_left_click = close_current
    mouse_middle_click = do_action, close_current
    mouse_right_click = close_all

[urgency_low]
    background = "{{colors.surface_container_lowest.dark.hex}}"
    foreground = "{{colors.on_surface_variant.dark.hex}}"
    frame_color = "{{colors.outline_variant.dark.hex}}"
    highlight = "{{colors.secondary.dark.hex}}"
    timeout = 4

[urgency_normal]
    background = "{{colors.surface_container.dark.hex}}"
    foreground = "{{colors.on_surface.dark.hex}}"
    frame_color = "{{colors.outline.dark.hex}}"
    highlight = "{{colors.primary.dark.hex}}"
    timeout = 6

[urgency_critical]
    background = "{{colors.error_container.dark.hex}}"
    foreground = "{{colors.on_error_container.dark.hex}}"
    frame_color = "{{colors.error.dark.hex}}"
    highlight = "{{colors.error.dark.hex}}"
    timeout = 0

# ── RULES FOR CLEAN & USEFUL NOTIFICATIONS ─────────────
[volume]
    summary = "*Volume*"
    set_stack_tag = "volume"
    history_ignore = true

[brightness]
    summary = "*Brightness*"
    set_stack_tag = "brightness"
    history_ignore = true

[mic]
    summary = "*Microphone*"
    set_stack_tag = "mic"
    history_ignore = true

[clipboard]
    summary = "*Clipboard*"
    set_stack_tag = "clipboard"
    timeout = 2

[screenshot]
    summary = "*Screenshot*"
    set_stack_tag = "screenshot"
    timeout = 4
