"$schema" = 'https://starship.rs/config-schema.json'
palette = 'matugen'

add_newline = false
scan_timeout = 30
command_timeout = 800

format = """$directory$git_branch$git_status$cmd_duration$character"""

[directory]
style = "bold #e5e2e0"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = "󰘬 "
format = "[$symbol$branch]($style) "
style = "bold {{colors.primary.dark.hex}}"
truncation_length = 24
truncation_symbol = "…"
only_attached = true

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold {{colors.outline.dark.hex}}"
conflicted = "󰀨"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
format = "$symbol "
success_symbol = "[❯](bold {{colors.primary.dark.hex}})"
error_symbol = "[❯](bold {{colors.error.dark.hex}})"
vimcmd_symbol = "[❮](bold {{colors.outline.dark.hex}})"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "dimmed {{colors.outline.dark.hex}}"

[palettes.matugen]
primary = "{{colors.primary.dark.hex}}"
secondary = "{{colors.secondary.dark.hex}}"
tertiary = "{{colors.tertiary.dark.hex}}"
error = "{{colors.error.dark.hex}}"
